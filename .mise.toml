min_version = "2026.8.5"

[tools]
erlang = "29.0.4"
elixir = "1.20.3-otp-29"
node = "26.5.0"
"npm:@fission-ai/openspec" = "1.9.0"

[env]
QUICK_TRAIN_POSTGRES_PORT = "55433"

[tasks.setup]
description = "Install dependencies and prepare the database"
run = ["mix deps.get", "mix ecto.setup"]

[tasks."db.start"]
description = "Start PostgreSQL"
run = "docker compose up -d postgres"

[tasks."db.stop"]
description = "Stop PostgreSQL"
run = "docker compose stop postgres"

[tasks."storage.test"]
description = "Qualify HTTPS storage on a disposable local VersityGW instance"
run = "scripts/storage/test"

[tasks."storage.setup"]
description = "Create local storage TLS and credentials and bootstrap the persistent bucket"
run = "scripts/storage/setup"

[tasks."storage.start"]
description = "Start persistent local storage and verify its configuration"
run = "scripts/storage/start"

[tasks."storage.stop"]
description = "Stop only the persistent local storage service"
run = "scripts/storage/stop"

[tasks."storage.check"]
description = "Explicitly qualify the configured AWS bucket and application identity"
run = "scripts/storage/check"

[tasks.test]
description = "Run backend tests"
run = "MIX_ENV=test mix test"

[tasks."openspec.validate"]
description = "Validate all OpenSpec changes and specifications"
run = "openspec validate --all --strict --no-interactive"

[tasks."dependency.audit"]
description = "Audit locked packages for security advisories and retired releases"
run = "MIX_ENV=test mix dependency.audit"

[tasks.verify]
description = "Run the complete project verification gate"
run = [
  "openspec validate --all --strict --no-interactive",
  "MIX_ENV=test mix verify",
  "scripts/storage/test",
]

[tasks.server]
description = "Run the Phoenix API server"
run = "mix phx.server"
